[project]
name = "veralyt"
version = "0.1.0"
description = "Local-first spreadsheet analysis agent for finance teams"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "charset-normalizer>=3.4.0",
    "duckdb>=1.3.0",
    "fastapi>=0.141.1",
    "fastexcel>=0.16.0",
    "jinja2>=3.1.0",
    "langgraph>=0.6.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "matplotlib>=3.10.0",
    "ollama>=0.6.0",
    "openpyxl>=3.1.0",
    "pandas>=2.3.0",
    "polars>=1.31.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",
    "sqlglot>=27.0.0",
    "uvicorn>=0.52.4",
    "xlsxwriter>=3.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["ollama: requires the local Ollama service and qwen3.5:4b model"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
